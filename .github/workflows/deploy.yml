name: Deploy to Simply.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simply-com-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PHP application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create production database config
        env:
          DB_HOST: ${{ secrets.SIMPLY_DB_HOST }}
          DB_NAME: ${{ secrets.SIMPLY_DB_NAME }}
          DB_USERNAME: ${{ secrets.SIMPLY_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.SIMPLY_DB_PASSWORD }}
        run: |
          printf '%s\n' \
            '<?php' \
            'return [' \
            "    'host' => '$DB_HOST'," \
            "    'name' => '$DB_NAME'," \
            "    'username' => '$DB_USERNAME'," \
            "    'password' => '$DB_PASSWORD'," \
            '];' \
            > config.php

      - name: Deploy to Simply.com using FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.simply.com
          port: 21
          username: ${{ secrets.SIMPLY_FTP_USERNAME }}
          password: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/dwp/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.env
            **/.env.*
            **/*.md
            **/database.sql
            LICENSE